# 知序 nginx 反向代理（单节点）。
#
# 证书由 certbot 管理，compose 把宿主机 ./deploy/certs 挂到 /etc/letsencrypt:ro。
# 证书名固定为 zhixu，与域名解耦：
#   /etc/letsencrypt/live/zhixu/fullchain.pem
#   /etc/letsencrypt/live/zhixu/privkey.pem
# 首次签发（仅启动应用、不启动 nginx）见 deploy/tls-bootstrap.sh。
# HTTP 80 只用于 ACME 挑战与跳转 HTTPS。

# 代理返回的静态资源也压缩；JS/CSS/JSON 是主要收益对象。
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    text/javascript
    text/css
    application/json
    application/manifest+json
    application/xml
    text/plain
    image/svg+xml;

upstream zhixu_app {
    server zhixu:3001;
    keepalive 8;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────
server {
    listen 80;
    # 部署前把 study.example.com 替换为你的实际域名。
    server_name study.example.com;

    # ACME HTTP-01 挑战；compose 已把 ./deploy/certbot 挂载到此目录。
    # 续期使用 webroot，因此该 location 必须保留且不能被 301 覆盖。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        # 固定公网域名，避免把不受信任的 Host 反射进 Location。
        return 301 https://study.example.com$request_uri;
    }
}

# ── HTTPS 主站 ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_tokens off;
    # 部署前替换为你的实际域名，与 HTTP 跳转和 ZHIXU_PUBLIC_ORIGIN 保持一致。
    server_name study.example.com;

    # certbot 默认 cert-name=zhixu，路径与 docker-compose.yml 的挂载一致。
    ssl_certificate     /etc/letsencrypt/live/zhixu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhixu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 没有声明 add_header 的 location 才继承这里；真实的 /api、/assets、/ 各自 include。
    include /etc/nginx/security-headers.conf;

    # 请求体限制：与后端 BODY_LIMIT 对齐并留出 JSON 结构余量。
    client_max_body_size 32m;

    # 应用容器不可用时（连接失败）返回维护页；POST /api/ 也同样得到明确提示。
    error_page 502 503 504 /50x.html;

    # ── 维护页：仅内部跳转使用，避免被直接当静态资源访问 ──────────────────
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # ── API：转发到 Node，不缓存，不记录请求体 ────────────────────────────
    location /api/ {
        proxy_pass http://zhixu_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Host 保留对外域名，服务端据此校验可信 Host。
        proxy_set_header Host $host;
        # Origin 透传，服务端做跨站写保护；nginx 变量名是 $http_origin。
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 200s;
        proxy_send_timeout 60s;

        # 不缓存任何 API 响应（会话、配置、学习数据都不能进共享缓存）。
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;

        # 访问日志不记录请求体（默认不记 body），避免对话正文进入日志；
        # 输出到容器 stdout，便于 docker logs/集中采集。
        access_log /dev/stdout;
    }

    # ── 静态资源（Vite 构建产物）：指纹文件长缓存 ─────────────────────────
    location /assets/ {
        proxy_pass http://zhixu_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # ── SPA：未知路径交给服务端 index.html，HTML 不缓存 ──────────────────

    location / {
        proxy_pass http://zhixu_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # HTML 入口禁止缓存，发布新版本后立即生效。
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
