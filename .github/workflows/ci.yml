name: CI

# 只做离线回归：不配置任何真实模型/搜索密钥，不构建或启动 Docker，
# 不运行 eval:teaching（需要真实供应商密钥），也不触碰部署环境。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 应用要求 >=22.13；测试使用 module.registerHooks，需要 22.15+。
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        # lockfile 的 resolved 指向区域镜像；CI 统一回到官方 registry 拉取同版本 tarball。
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org --replace-registry-host=always

      - name: Type check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
